<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Corporate Ocean-to-Sky Blue Outer Ring Gradient -->
    <linearGradient id="contact-ring-grad" x1="20" y1="16" x2="180" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0072b8"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
    <radialGradient id="contact-ring-glow" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#7ad0f5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0072b8" stop-opacity="0"/>
    </radialGradient>
    <!-- Specular Rim Highlight -->
    <linearGradient id="contact-rim" x1="100" y1="10" x2="100" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#071828" stop-opacity="0.38"/>
    </linearGradient>
    <!-- Inner White Card Surface -->
    <linearGradient id="contact-card-bg" x1="100" y1="24" x2="100" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <!-- Dual Chat Bubble Gradient -->
    <linearGradient id="contact-icon-grad" x1="52" y1="58" x2="148" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e96d6"/>
      <stop offset="55%" stop-color="#0072b8"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>
    <filter id="contact-card-shadow" x="14" y="16" width="172" height="174" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b2545" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Outer Architectural Squircle Ring -->
  <rect x="8" y="8" width="184" height="184" rx="48" fill="url(#contact-ring-grad)"/>
  <rect x="8" y="8" width="184" height="184" rx="48" fill="url(#contact-ring-glow)"/>
  <rect x="9.5" y="9.5" width="181" height="181" rx="46.5" stroke="url(#contact-rim)" stroke-width="2"/>

  <!-- Elevated Inner White Squircle -->
  <g filter="url(#contact-card-shadow)">
    <rect x="24" y="24" width="152" height="152" rx="34" fill="url(#contact-card-bg)"/>
    <rect x="24.75" y="24.75" width="150.5" height="150.5" rx="33.25" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Crisp Dual Chat Bubble Vector -->
  <g stroke="url(#contact-icon-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Secondary background chat bubble -->
    <path d="M120 82h18a8 8 0 0 1 8 8v34a8 8 0 0 1-8 8h-4v12l-14-12H92a8 8 0 0 1-8-8v-10"/>
    <!-- Primary foreground chat bubble -->
    <path d="M62 62h54a8 8 0 0 1 8 8v32a8 8 0 0 1-8 8H80l-14 12v-12h-4a8 8 0 0 1-8-8V70a8 8 0 0 1 8-8z" fill="#ffffff" fill-opacity="0.92"/>
    <!-- Message lines inside primary bubble -->
    <line x1="71" y1="80" x2="107" y2="80"/>
    <line x1="71" y1="93" x2="94" y2="93"/>
  </g>
</svg>
